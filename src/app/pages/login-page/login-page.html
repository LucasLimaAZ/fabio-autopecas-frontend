<div class="login-page-container">
  <mat-card appearance="outlined" class="login-card">
    <mat-card-header>
      <mat-card-title>Bem-Vindo</mat-card-title>
      <mat-card-subtitle>Faça login</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>Usuário</mat-label>
        <input matInput type="text" placeholder="email@exemplo.com.br" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <button matButton="outlined">Acessar</button>
    </mat-card-content>
  </mat-card>
</div>
